# Pemeriksaan otomatis pada setiap push dan pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  periksa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # samakan dengan "engines" di package.json
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tes
        run: npm test

      - name: Build web
        run: npm run build

      - name: Build server
        run: npm run build:server
