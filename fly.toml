# Phase 1 sengaja satu Machine: SQLite + broker SSE dalam-memori tidak boleh
# diskalakan horizontal sebelum dimigrasikan ke PostgreSQL + Redis/NATS.
app = "warga-jaga-warga-wjw"
primary_region = "sin"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  WJW_DB = "/data/wjw.sqlite"
  # Jadwal ronda di tenant Indonesia memakai WIB secara konsisten, bukan UTC
  # dari host Fly. Konfigurasi zona per-tenant dapat ditambahkan saat ekspansi.
  TZ = "Asia/Jakarta"

[[mounts]]
source = "wjw_data"
destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
